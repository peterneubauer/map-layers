<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Arial, sans-serif">
  <rect width="400" height="200" fill="#1e2a1e"/>
  <text x="200" y="20" fill="#ffd91a" font-size="13" text-anchor="middle" font-weight="bold">From field sample to species list</text>
  <g font-size="10.5" fill="#fff" text-anchor="middle">
    <g transform="translate(55,0)">
      <path d="M-30 120 L0 60 L30 120 Z" fill="#cfd8cf" fill-opacity="0.8"/><rect x="-4" y="44" width="8" height="18" fill="#fff"/>
      <text y="140">Malaise trap</text><text y="154" fill="#cfd8cf">insects, weekly</text>
      <text y="176" fill="#cfd8cf">× 4 sites</text>
    </g>
    <g transform="translate(150,0)">
      <rect x="-22" y="96" width="44" height="24" fill="#6b4f2f"/><rect x="-6" y="64" width="12" height="34" rx="2" fill="#cfd8cf"/>
      <text y="140">Soil samples</text><text y="154" fill="#cfd8cf">40 in total</text>
    </g>
    <text x="205" y="94" fill="#ffd91a" font-size="20">→</text>
    <g transform="translate(260,0)">
      <path d="M-14 60 h28 v8 l-6 46 h-16 l-6 -46z" fill="#7fd39b" fill-opacity="0.5" stroke="#7fd39b"/>
      <text y="140">DNA extraction</text><text y="154" fill="#cfd8cf">and sequencing</text>
    </g>
    <text x="305" y="94" fill="#ffd91a" font-size="20">→</text>
    <g transform="translate(355,0)">
      <rect x="-26" y="54" width="52" height="66" rx="4" fill="#fff"/>
      <g fill="#1e2a1e"><rect x="-18" y="64" width="36" height="4"/><rect x="-18" y="74" width="28" height="4"/><rect x="-18" y="84" width="34" height="4"/><rect x="-18" y="94" width="24" height="4"/><rect x="-18" y="104" width="30" height="4"/></g>
      <text y="140">Species list</text><text y="154" fill="#cfd8cf">spring 2027</text>
    </g>
  </g>
  <text x="200" y="192" fill="#cfd8cf" font-size="10" text-anchor="middle">June–September 2026, substrate changed every week · FinBIO and Artdatabanken</text>
</svg>
