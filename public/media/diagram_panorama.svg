<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Arial, sans-serif">
  <rect width="400" height="200" fill="#1e2a1e"/>
  <text x="200" y="22" fill="#ffd91a" font-size="13" text-anchor="middle" font-weight="bold">One panorama = 22 × 4 photos (360°)</text>
  <g transform="translate(20,36)">
    <g fill="#27ae60" fill-opacity="0.35" stroke="#7fd39b" stroke-width="0.8">
      <!-- 22 kolumner x 4 rader -->
      <g id="row"><rect x="0" y="0" width="15" height="22"/><rect x="16" y="0" width="15" height="22"/><rect x="32" y="0" width="15" height="22"/><rect x="48" y="0" width="15" height="22"/><rect x="64" y="0" width="15" height="22"/><rect x="80" y="0" width="15" height="22"/><rect x="96" y="0" width="15" height="22"/><rect x="112" y="0" width="15" height="22"/><rect x="128" y="0" width="15" height="22"/><rect x="144" y="0" width="15" height="22"/><rect x="160" y="0" width="15" height="22"/><rect x="176" y="0" width="15" height="22"/><rect x="192" y="0" width="15" height="22"/><rect x="208" y="0" width="15" height="22"/><rect x="224" y="0" width="15" height="22"/><rect x="240" y="0" width="15" height="22"/><rect x="256" y="0" width="15" height="22"/><rect x="272" y="0" width="15" height="22"/><rect x="288" y="0" width="15" height="22"/><rect x="304" y="0" width="15" height="22"/><rect x="320" y="0" width="15" height="22"/><rect x="336" y="0" width="15" height="22"/></g>
      <use href="#row" y="23"/><use href="#row" y="46"/><use href="#row" y="69"/>
    </g>
    <rect x="0" y="0" width="351" height="91" fill="none" stroke="#ffd91a" stroke-width="1.5"/>
    <text x="0" y="108" fill="#cfd8cf" font-size="10">−180°</text><text x="351" y="108" fill="#cfd8cf" font-size="10" text-anchor="end">+180°</text>
    <text x="175" y="108" fill="#cfd8cf" font-size="10" text-anchor="middle">looking down at the field layer</text>
  </g>
  <text x="200" y="168" fill="#fff" font-size="11" text-anchor="middle">24 MP camera on a motorised gimbal, 30 % overlap</text>
  <text x="200" y="186" fill="#fff" font-size="11" text-anchor="middle">6 points × 3 placements × 88 photos = 1,584 images</text>
</svg>
